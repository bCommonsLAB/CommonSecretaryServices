# Sicher per Default (Sicherheitsplan AP-07):
# - MongoDB ist nur im Compose-Netz erreichbar (kein Host-Port) und verlangt Anmeldung.
# - Ohne MONGO_ROOT_USER und MONGO_ROOT_PASSWORD in der .env startet Compose nicht.
# - Bestehende Installationen mit Daten: docs/deployment/mongo-migration.md
services:
  secretary-services:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./logs:/app/logs
      - ./temp-processing:/app/temp-processing
      - ./cache:/app/cache
      - ./config/config.yaml:/app/config/config.yaml
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/api/health/live', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      # API-Keys werden ausschließlich hier (bzw. in der .env) gepflegt,
      # niemals in config.yaml oder im Frontend.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Passwort nur aus Buchstaben und Ziffern (z. B. `openssl rand -hex 24`), weil es in der URI steht.
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER fehlt in der .env (siehe .env.example)}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD fehlt in der .env (siehe .env.example)}@mongodb:27017/${MONGO_DB_NAME:-commonsec}?authSource=admin
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Flask MAX_CONTENT_LENGTH; Default 500 MB, überschreibbar via .env
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
      # Sicherheit (docs/deployment/dashboard-anmeldung.md). Ohne SECRETARY_SERVICE_API_KEY
      # startet der Dienst nicht; ohne Dashboard-Anmeldung ist das Dashboard gesperrt.
      # Leere Werte gelten als nicht gesetzt.
      - SECRETARY_SERVICE_API_KEY=${SECRETARY_SERVICE_API_KEY:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-0}
      - DASHBOARD_AUTH_MODE=${DASHBOARD_AUTH_MODE:-}
      - DASHBOARD_REQUIRED_GROUP=${DASHBOARD_REQUIRED_GROUP:-}
      - DASHBOARD_ALLOWED_USERS=${DASHBOARD_ALLOWED_USERS:-}
      - DASHBOARD_USER=${DASHBOARD_USER:-}
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - SWAGGER_IP_WHITELIST=${SWAGGER_IP_WHITELIST:-}

  mongodb:
    image: mongo:6
    restart: unless-stopped
    # --auth erzwingt die Anmeldung auch fuer bestehende Datenverzeichnisse.
    # Kein "ports:"-Eintrag: die Datenbank ist von aussen nicht erreichbar.
    command: ["mongod", "--auth"]
    environment:
      # Legt den Admin-Benutzer nur bei einem leeren Datenverzeichnis an.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?MONGO_ROOT_USER fehlt in der .env (siehe .env.example)}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD fehlt in der .env (siehe .env.example)}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mongo_data: 